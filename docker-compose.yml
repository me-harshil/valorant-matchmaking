services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: valorant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d

  account-service:
    build:
      context: .
      dockerfile: cmd/account-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/valorant
    depends_on:
      - postgres

  rating-service:
    build:
      context: .
      dockerfile: cmd/rating-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/valorant
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      - postgres
      - account-service

  match-service:
    build:
      context: .
      dockerfile: cmd/match-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/valorant
    depends_on:
      - postgres

  matchmaking-service:
    build:
      context: .
      dockerfile: cmd/matchmaking-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      MATCH_SERVICE_URL: http://match-service:8083
    depends_on:
      - match-service

volumes:
  pgdata:
